# macOS packages: builds the x64 and arm64 DMGs (DMGs need macOS) and checks them on an Apple
# Silicon runner. Packages are kept as workflow artifacts only; no GitHub Release is created.
name: macOS packages

on:
  push:
    branches: [main]
    tags: ['v*']
    # Tag pushes ignore path filters, so a release tag always builds.
    paths-ignore: [README.md, 'docs/**']
  pull_request:
    paths-ignore: [README.md, 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # electron-builder skips signing on pull_request builds; the ad-hoc identity '-' needs no secrets.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build DMGs (x64, arm64)
        run: npm run dist:mac

      - name: Build the update-chain versions (arm64)
        # Far above any published release: the live source never offers these apps a newer version.
        run: |
          npx electron-builder --mac dmg --arm64 --publish never -c.extraMetadata.version=9000.0.0 -c.directories.output=dist-chain
          npx electron-builder --mac dmg --arm64 --publish never -c.extraMetadata.version=9000.0.1 -c.directories.output=dist-next

      - name: Install check tools
        run: |
          npm install --no-save playwright-core@1.56.1
          arch -x86_64 /usr/bin/true || softwareupdate --install-rosetta --agree-to-license

      - name: Inspect packages
        run: node scripts/ci/mac-update-smoke.mjs inspect

      - name: Intel app under Rosetta
        run: node scripts/ci/mac-update-smoke.mjs x64

      - name: Update chain on Apple Silicon
        run: node scripts/ci/mac-update-smoke.mjs update

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-packages-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/latest-mac.yml
            mac-smoke/
          if-no-files-found: warn
          retention-days: 14
