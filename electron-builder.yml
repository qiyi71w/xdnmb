# Installers: Windows x64 NSIS (assisted: for me or for all users) and macOS x64 / arm64 DMG, using prebuilt Electron.
# The identity below is permanent: it keeps the data directory, the Windows install/uninstall entry,
# taskbar and notification identity, and the macOS bundle identifier stable across versions.
appId: io.github.qiyi71w.xidao
productName: 汐岛
executableName: xidao
copyright: Copyright © qiyi71w
# Release assets must keep their names on GitHub (it renames non-ASCII names), and the update
# metadata names them exactly: xidao-<version>-<os>-<arch>.<ext>.
artifactName: xidao-${version}-${os}-${arch}.${ext}
directories:
  output: dist
files:
  - out/**/*
  - resources/icons/**/*
  - package.json
  - LICENSE
# These renderer dependencies are bundled into out/, not shipped as production node_modules.
# Copy their notices from the locked installed versions rather than maintaining duplicate text.
extraResources:
  - from: node_modules/react/LICENSE
    to: licenses/react-LICENSE.txt
  - from: node_modules/react-dom/LICENSE
    to: licenses/react-dom-LICENSE.txt
  - from: node_modules/scheduler/LICENSE
    to: licenses/scheduler-LICENSE.txt
# The update metadata's fixed source; the client also fixes it in code.
publish:
  provider: github
  owner: qiyi71w
  repo: xdnmb
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icons/xidao-icon.ico
  # No developer certificate: nothing is signed and the updater does not ask for a publisher.
  signAndEditExecutable: true
  verifyUpdateCodeSignature: false
nsis:
  # Assisted installer: mode (only for me by default, or all users with administrator approval),
  # location, the desktop shortcut option and a finish page; an existing installation keeps its
  # mode. In-app updates (`--updated`) skip every page. See resources/installer.nsh.
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  include: resources/installer.nsh
  # A single installer language (no language selector); electron-builder needs the multi-language
  # path to use any language other than en_US.
  installerLanguages: [zh_CN]
  language: '2052'
  # The start menu shortcut is always created; the desktop one follows the installer option.
  createStartMenuShortcut: true
  createDesktopShortcut: true
  # Uninstalling keeps the data directory; updates never touch it.
  deleteAppDataOnUninstall: false
  # The client always downloads whole installers.
  differentialPackage: false
  installerIcon: resources/icons/xidao-icon.ico
  uninstallerIcon: resources/icons/xidao-icon.ico
  shortcutName: 汐岛
  uninstallDisplayName: 汐岛

mac:
  # macOS uses the bundle filename in Finder and the Dock; Windows keeps xidao.exe.
  executableName: 汐岛
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: resources/icons/xidao-icon.icns
  category: public.app-category.social-networking
  minimumSystemVersion: '13.0'
  # Ad-hoc signature only (required to run on Apple Silicon); not a Developer ID and not notarized.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
